scenarios:
  - name: "Skip sequence generation when name already differs from initial_string"
    steps:
      - step: "Find tester model in ir.model"
        action: "search"
        model: "ir.model"
        domain:
          - ["model", "=", "ssi.test.sequence"]
        save_as: "tester_model"
        limit: 1
        expect_count: 1

      - step: "Find name field in ir.model.fields"
        action: "search"
        model: "ir.model.fields"
        domain:
          - ["model_id", "=", "EVAL: registry['tester_model'].id"]
          - ["name", "=", "name"]
        save_as: "field_name"
        limit: 1
        expect_count: 1

      - step: "Find date field in ir.model.fields"
        action: "search"
        model: "ir.model.fields"
        domain:
          - ["model_id", "=", "EVAL: registry['tester_model'].id"]
          - ["ttype", "in", ["date", "datetime"]]
        save_as: "field_date"
        limit: 1
        expect_count: 1

      - step: "Create ir.sequence"
        action: "create"
        model: "ir.sequence"
        save_as: "ir_seq"
        values:
          name: "Test Seq - Initial String Skip"
          code: "ssi.test.seq.skip"
          prefix: "SKIP/"
          number_next: 1
          number_increment: 1
          padding: 6

      - step: "Create sequence.template with initial_string '/'"
        action: "create"
        model: "sequence.template"
        save_as: "template"
        values:
          name: "Template - Initial String Skip"
          model_id: "EVAL: registry['tester_model'].id"
          sequence_field_id: "EVAL: registry['field_name'].id"
          date_field_id: "EVAL: registry['field_date'].id"
          initial_string: "/"
          computation_method: "use_python"
          python_code: "result = True"
          sequence_selection_method: "use_sequence"
          sequence_id: "EVAL: registry['ir_seq'].id"

      - step: "Create document whose name already differs from initial_string"
        action: "create"
        model: "ssi.test.sequence"
        save_as: "doc"
        values:
          name: "EXISTING-000001"
          value: 10

      - step: "Assert name is the pre-set value before calling _create_sequence"
        action: "assert"
        target: "doc"
        asserts:
          name:
            type: "value"
            expected: "EXISTING-000001"

      - step: "Call _create_sequence — generation should be skipped"
        action: "call"
        target: "doc"
        method: "_create_sequence"

      - step: "Assert name is unchanged because it differed from initial_string"
        action: "assert"
        target: "doc"
        asserts:
          name:
            type: "value"
            expected: "EXISTING-000001"
