scenarios:
  - name: "Template with higher sequence order value is selected first"
    steps:
      - step: "Find tester model in ir.model"
        action: "search"
        model: "ir.model"
        domain:
          - ["model", "=", "ssi.test.sequence"]
        save_as: "tester_model"
        limit: 1
        expect_count: 1

      - step: "Find name field in ir.model.fields"
        action: "search"
        model: "ir.model.fields"
        domain:
          - ["model_id", "=", "EVAL: registry['tester_model'].id"]
          - ["name", "=", "name"]
        save_as: "field_name"
        limit: 1
        expect_count: 1

      - step: "Find date field in ir.model.fields"
        action: "search"
        model: "ir.model.fields"
        domain:
          - ["model_id", "=", "EVAL: registry['tester_model'].id"]
          - ["ttype", "in", ["date", "datetime"]]
        save_as: "field_date"
        limit: 1
        expect_count: 1

      - step: "Create ir.sequence for low-priority template"
        action: "create"
        model: "ir.sequence"
        save_as: "ir_seq_low"
        values:
          name: "Test Seq - Low Priority"
          code: "ssi.test.seq.low"
          prefix: "LOW/"
          number_next: 1
          number_increment: 1
          padding: 6

      - step: "Create ir.sequence for high-priority template"
        action: "create"
        model: "ir.sequence"
        save_as: "ir_seq_high"
        values:
          name: "Test Seq - High Priority"
          code: "ssi.test.seq.high"
          prefix: "HIGH/"
          number_next: 1
          number_increment: 1
          padding: 6

      - step: "Create low-priority template (sequence=10)"
        action: "create"
        model: "sequence.template"
        save_as: "template_low"
        values:
          name: "Template - Low Priority"
          model_id: "EVAL: registry['tester_model'].id"
          sequence_field_id: "EVAL: registry['field_name'].id"
          date_field_id: "EVAL: registry['field_date'].id"
          initial_string: "/"
          computation_method: "use_python"
          python_code: "result = True"
          sequence_selection_method: "use_sequence"
          sequence_id: "EVAL: registry['ir_seq_low'].id"
          sequence: 10

      - step: "Create high-priority template (sequence=100, checked first)"
        action: "create"
        model: "sequence.template"
        save_as: "template_high"
        values:
          name: "Template - High Priority"
          model_id: "EVAL: registry['tester_model'].id"
          sequence_field_id: "EVAL: registry['field_name'].id"
          date_field_id: "EVAL: registry['field_date'].id"
          initial_string: "/"
          computation_method: "use_python"
          python_code: "result = True"
          sequence_selection_method: "use_sequence"
          sequence_id: "EVAL: registry['ir_seq_high'].id"
          sequence: 100

      - step: "Create test document"
        action: "create"
        model: "ssi.test.sequence"
        save_as: "doc"
        values:
          name: "/"
          value: 10

      - step: "Generate sequence"
        action: "call"
        target: "doc"
        method: "_create_sequence"

      - step: "Assert high-priority template was selected (name contains HIGH/)"
        action: "assert"
        target: "doc"
        asserts:
          name:
            type: "value"
            operator: "contains"
            expected: "HIGH/"
