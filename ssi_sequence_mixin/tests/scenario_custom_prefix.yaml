scenarios:
  - name: "Sequence generation with custom prefix prepended to sequence number"
    steps:
      - step: "Find tester model in ir.model"
        action: "search"
        model: "ir.model"
        domain:
          - ["model", "=", "ssi.test.sequence"]
        save_as: "tester_model"
        limit: 1
        expect_count: 1

      - step: "Find name field in ir.model.fields"
        action: "search"
        model: "ir.model.fields"
        domain:
          - ["model_id", "=", "EVAL: registry['tester_model'].id"]
          - ["name", "=", "name"]
        save_as: "field_name"
        limit: 1
        expect_count: 1

      - step: "Find date field in ir.model.fields"
        action: "search"
        model: "ir.model.fields"
        domain:
          - ["model_id", "=", "EVAL: registry['tester_model'].id"]
          - ["ttype", "in", ["date", "datetime"]]
        save_as: "field_date"
        limit: 1
        expect_count: 1

      - step: "Create ir.sequence (no prefix — prefix comes from template code)"
        action: "create"
        model: "ir.sequence"
        save_as: "ir_seq"
        values:
          name: "Test Seq - Custom Prefix"
          code: "ssi.test.seq.cprefix"
          number_next: 1
          number_increment: 1
          padding: 6

      - step: "Create sequence.template with add_custom_prefix enabled"
        action: "create"
        model: "sequence.template"
        save_as: "template"
        values:
          name: "Template - Custom Prefix"
          model_id: "EVAL: registry['tester_model'].id"
          sequence_field_id: "EVAL: registry['field_name'].id"
          date_field_id: "EVAL: registry['field_date'].id"
          initial_string: "/"
          computation_method: "use_python"
          python_code: "result = True"
          sequence_selection_method: "use_sequence"
          sequence_id: "EVAL: registry['ir_seq'].id"
          add_custom_prefix: true
          prefix_python_code: "result = 'CPREFIX/'"

      - step: "Create test document"
        action: "create"
        model: "ssi.test.sequence"
        save_as: "doc"
        values:
          name: "/"
          value: 15

      - step: "Generate sequence"
        action: "call"
        target: "doc"
        method: "_create_sequence"

      - step: "Assert name starts with custom prefix"
        action: "assert"
        target: "doc"
        asserts:
          name:
            type: "value"
            operator: "contains"
            expected: "CPREFIX/"

      - step: "Assert sequence number is appended after prefix"
        action: "assert"
        target: "doc"
        asserts:
          name:
            type: "value"
            operator: "contains"
            expected: "000001"

      - step: "Assert final value is prefix concatenated with sequence number"
        action: "assert"
        target: "doc"
        asserts:
          name:
            type: "value"
            expected: "CPREFIX/000001"
